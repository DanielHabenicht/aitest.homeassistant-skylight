name: Skylight Calendar
version: "1.0.0"
slug: skylight_calendar
description: A family calendar add-on for Home Assistant with day/week/month views, event management, and todo list integration
arch:
  - armhf
  - armv7
  - aarch64
  - amd64
  - i386
startup: application
boot: auto
init: false
ports:
  8099/tcp: 8099
webui: http://[HOST]:8099
ingress: true
ingress_port: 8099
panel_icon: mdi:calendar-multiple
panel_title: Skylight Calendar
options:
  default_view: "month"
  show_week_numbers: true
  first_day_of_week: 1
schema:
  default_view: list(day|week|month)
  show_week_numbers: bool
  first_day_of_week: int(0,6)
